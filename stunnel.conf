; stunnel — RTMP → RTMPS proxy for Facebook Live
; nginx pushes to rtmp://127.0.0.1:19350/rtmp/<key>
; stunnel wraps that TCP stream in TLS and forwards to Facebook.

; Run in foreground so the container process tree stays clean
foreground = yes

; System CA bundle (Alpine ships with ca-certificates via stunnel dep)
CAfile = /etc/ssl/certs/ca-certificates.crt
verifyChain = yes

; Reduce logging noise; use 5 for debug
debug = 4
output = /dev/stdout

[facebook-rtmps]
client  = yes
accept  = 127.0.0.1:19350
connect = live-api-s.facebook.com:443
