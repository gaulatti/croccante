load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

# MUST stay 1. nginx-rtmp keeps live stream state per worker process and does
# not share it between them: with multiple workers, the publisher lands on one
# worker while a relay's playback request lands on another that has never heard
# of the stream, and every relay times out with no data. rtmp_auto_push exists
# to bridge workers, but a single-publisher relay has no reason to need it.
worker_processes 1;
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections 1024;
}

# Loopback-only stat endpoint. The healthcheck uses it to compare what nginx
# believes about connected publishers against what the relay supervisors
# believe, which is how a silently-failing exec_publish hook gets caught.
http {
    access_log off;
    server {
        listen 127.0.0.1:8080;
        location /stat {
            rtmp_stat all;
        }
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # OBS publishes here. Relay wrappers subscribe here. Nothing is pushed
        # by nginx itself — fan-out is done by one ffmpeg wrapper per
        # destination, started by entrypoint.sh. See docs/architecture.md.
        application live {
            live on;
            record off;

            # Hand subscribers a keyframe first so relays start cleanly.
            wait_key on;

            # Reclaim a publisher slot whose client vanished without a FIN.
            # Also bounds how long a relay ffmpeg can sit on a dead input.
            drop_idle_publisher 10s;

            # Publishing is only reachable on the port the container exposes,
            # which the deploy binds to 127.0.0.1. Playback is local-only:
            # the relay wrappers are the only subscribers.
            allow publish all;
            allow play 127.0.0.1;
            deny play all;

            # State signalling for the relay wrappers. relay-start.sh records
            # the live stream name; relay-stop.sh clears it. Wrappers poll that
            # state and retry forever, so a publisher gap is survived without
            # restarting anything.
            exec_publish      /usr/local/bin/relay-start.sh $name;
            exec_publish_done /usr/local/bin/relay-stop.sh  $name;
        }
    }
}
