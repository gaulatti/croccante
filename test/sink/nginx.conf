load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;
# Must be 1: nginx-rtmp does not share live stream state between workers.
worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;
events { worker_connections 256; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        # Record everything that arrives so the harness can assert on bytes,
        # not just on a TCP connection having been accepted.
        application live {
            live on;
            record all;
            record_path /rec;
            record_unique on;
        }
    }
}
